name: Fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target.func }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: "./encoding/", func: "FuzzDecodeVarUint" }
          - { pkg: "./crdt/",     func: "FuzzApplyUpdateV1" }
          - { pkg: "./crdt/",     func: "FuzzApplyUpdateV2" }
          - { pkg: "./sync/",     func: "FuzzApplySyncMessage" }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23"
          cache: true
      - name: Run fuzzer
        run: go test -run=^$ -fuzz=${{ matrix.target.func }} -fuzztime=300s ${{ matrix.target.pkg }}
      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ matrix.target.func }}
          # Go writes new crash inputs under <package>/testdata/fuzz/<Func>/,
          # not a repo-root testdata/fuzz/ — match any package's corpus so the
          # reproducer is actually captured when a fuzzer fails.
          path: "**/testdata/fuzz/**"
